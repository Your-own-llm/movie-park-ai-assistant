<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Production Assistant — Concept Demo</title>
<style>
:root{--bg:#090909;--panel:#111;--line:#292929;--text:#f3f0ea;--muted:#99958e;--gold:#d6c29a;--good:#9bc8a8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.nav{position:fixed;z-index:5;top:0;left:0;right:0;height:72px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;background:#090909cc;backdrop-filter:blur(18px);border-bottom:1px solid #222}.brand{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700}.brand b{color:var(--gold)}.links{display:flex;gap:25px;font-size:12px;color:#aaa}.links a:hover{color:#fff}.tag{font-size:9px;letter-spacing:.14em;text-transform:uppercase;border:1px solid #403d37;padding:8px 10px;color:#c9c3b8}.page{display:none;min-height:100vh;padding-top:72px}.page.on{display:block}.hero{min-height:calc(100vh - 72px);padding:10vw 5vw 8vw;display:flex;align-items:flex-end;position:relative;overflow:hidden;background:radial-gradient(circle at 78% 30%,#332f27,#171512 27%,#090909 65%)}.hero:after{content:"";position:absolute;width:45vw;height:45vw;right:-8vw;top:9vw;border:1px solid #d6c29a33;border-radius:50%;box-shadow:0 0 120px #d6c29a10,inset 0 0 80px #fff0003}.heroIn{position:relative;z-index:1;max-width:1000px}.ey{font-size:10px;letter-spacing:.22em;color:var(--gold);text-transform:uppercase;margin-bottom:22px}.hero h1,h2{font-family:Georgia,serif;font-weight:400;letter-spacing:-.05em}.hero h1{font-size:clamp(54px,8vw,112px);line-height:.9;margin:0 0 28px;max-width:1050px}.hero p{max-width:630px;color:#b4b0a8;line-height:1.7;font-size:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.btn{border:1px solid #777166;background:#e7dfd1;color:#111;padding:14px 20px;font-size:12px;font-weight:700}.btn.alt{background:transparent;color:#eee;border-color:#393733}.section,.shell{padding:80px 5vw;max-width:1350px;margin:auto}.section h2,h2{font-size:48px;margin:8px 0 12px}.lead,.sub{color:var(--muted);line-height:1.65}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin-top:42px}.step{background:var(--panel);padding:30px;min-height:175px}.step i{font-style:normal;color:var(--gold);font-size:10px;letter-spacing:.18em}.step h3{font-size:18px;margin:25px 0 9px}.step p{font-size:13px;color:var(--muted);line-height:1.55}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:30px}.chat{display:grid;grid-template-columns:1fr 285px;border:1px solid var(--line)}.messages{min-height:540px;padding:28px;display:flex;flex-direction:column;gap:16px}.msg{max-width:76%;padding:15px 17px;border:1px solid #292929;font-size:14px;line-height:1.55}.msg.ai{background:#141414}.msg.user{align-self:flex-end;background:#e7dfd1;color:#111;border-color:#e7dfd1}.msg small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:8px;color:#777;margin-bottom:6px}.msg.user small{color:#666}.composer{display:flex;gap:8px;padding:14px;border-top:1px solid var(--line)}input{flex:1;background:#151515;color:#fff;border:1px solid #303030;padding:13px;outline:none}.quick{padding:15px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:7px}.chip{background:#161616;color:#ddd;border:1px solid #343434;padding:8px 10px;font-size:11px}.side{padding:22px;border-left:1px solid var(--line)}.side h3{font-size:11px;text-transform:uppercase;letter-spacing:.14em}.progress{display:grid;gap:12px;margin-top:25px}.p{font-size:11px;color:#666}.p.done{color:#ddd}.p span{display:inline-block;width:7px;height:7px;border-radius:50%;background:#333;margin-right:8px}.p.done span{background:var(--good)}.note{margin-top:24px;border:1px dashed #383631;padding:14px;color:#777;font-size:10px;line-height:1.6}.briefGrid,.detailGrid{display:grid;grid-template-columns:1.4fr .7fr;gap:18px}.card,.tableWrap{background:#101010;border:1px solid var(--line);padding:27px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}.field{background:#111;padding:20px}.label{font-size:8px;text-transform:uppercase;letter-spacing:.15em;color:#777;margin-bottom:8px}.value{font-size:18px;margin-bottom:5px}.status,.badge{display:inline-block;padding:6px 8px;border:1px solid #35533f;color:var(--good);font-size:8px;text-transform:uppercase;letter-spacing:.12em}.analysis{border-left:1px solid var(--line);padding-left:24px}.row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #242424;font-size:11px}.row span{color:#777}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.project{height:330px;position:relative;border:1px solid var(--line);overflow:hidden;background:linear-gradient(145deg,#37332b,#0a0a0a)}.project:nth-child(2){background:linear-gradient(145deg,#20272a,#090909)}.project:nth-child(3){background:linear-gradient(145deg,#392e28,#090909)}.project:after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(transparent,#000)}.match{position:absolute;right:15px;top:15px;color:var(--gold);border:1px solid #d6c29a44;padding:6px;font-size:8px;z-index:1}.pbody{position:absolute;z-index:1;left:20px;right:20px;bottom:18px}.pbody h3{font-family:Georgia,serif;font-size:28px;font-weight:400;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);margin:25px 0}.stat{background:#101010;padding:20px}.stat b{font-family:Georgia,serif;font-size:34px;font-weight:400}.stat span{display:block;color:#777;text-transform:uppercase;letter-spacing:.13em;font-size:8px;margin-top:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:16px;border-bottom:1px solid #242424;font-size:11px}.table th{font-size:8px;color:#777;text-transform:uppercase;letter-spacing:.13em}.click{cursor:pointer}.back{background:none;border:0;color:#999;padding:0 0 18px}.conversation{margin-top:25px;border-top:1px solid #282828;padding-top:20px}.mini{padding:12px 0;border-bottom:1px solid #222;font-size:12px;line-height:1.6}.mini b{display:block;font-size:8px;letter-spacing:.13em;color:#777;text-transform:uppercase;margin-bottom:4px}@media(max-width:800px){.links{display:none}.steps,.projects,.stats,.briefGrid,.detailGrid{grid-template-columns:1fr}.chat{grid-template-columns:1fr}.side{display:none}.fields{grid-template-columns:1fr}.hero h1{font-size:57px}.section h2,h2{font-size:40px}.tableWrap{overflow:auto}.table{min-width:700px}}
</style></head><body>
<nav class="nav"><a class="brand" href="#/" onclick="route('/')" >AI <b>Production</b> Assistant</a><div class="links"><a href="#/assistant">Assistant</a><a href="#/portfolio">Portfolio</a><a href="#/brief">Brief</a><a href="#/admin">Admin</a></div><div class="tag">Concept Demo</div></nav>
<main id="app"></main>
<script>
var S={step:0,a:{},msgs:[],brief:null,inq:[
{id:1,client:'Dubai Luxury Automotive',project:'Commercial Film',location:'Dubai',budget:'$50K–$75K',status:'Qualified',date:'Today'},
{id:2,client:'Global Fashion Brand',project:'Campaign Film',location:'London',budget:'$100K+',status:'Review Required',date:'Yesterday'},
{id:3,client:'Tech Product Launch',project:'Product Film',location:'Singapore',budget:'$25K–$50K',status:'New',date:'2 days ago'},
{id:4,client:'Luxury Beverage Campaign',project:'Brand Film',location:'Paris',budget:'$50K–$75K',status:'Contacted',date:'3 days ago'}]};
var Q=[['projectType','What are you looking to produce?'],['brand','What is the brand or company name?'],['location','Where would the production take place?'],['deliverables','What deliverables are you looking for?'],['deadline','What is your preferred production date or delivery deadline?'],['budget','What budget range are you working with?'],['references','Do you have any visual references or creative direction?'],['requirements','Anything else the production team should know?']];
var OPT={projectType:['Commercial Film','Product Video','Social Campaign','Automotive Film','Fashion Film','CGI / VFX'],deliverables:['Hero Film','Social Cuts','Product Photography','CGI','Behind the Scenes'],budget:['Under $25K','$25K–$50K','$50K–$100K','$100K+','Not decided yet']};
function go(p){location.hash=p}
function el(x){document.getElementById('app').innerHTML=x}
function home(){el('<section class="hero"><div class="heroIn"><div class="ey">AI Production Assistant · Concept Demo</div><h1>Turn every production inquiry into a production-ready brief.</h1><p>An AI assistant designed to understand creative requests, qualify production requirements, and prepare structured briefs for a production team.</p><div class="actions"><button class="btn" onclick="go(\'/assistant\')">Start a Project Brief →</button><button class="btn alt" onclick="document.getElementById(\'workflow\').scrollIntoView()">Explore Demo</button></div></div></section><section class="section" id="workflow"><div class="ey">The workflow</div><h2>From idea to handoff.</h2><p class="lead">A conversational intake experience that turns an unstructured inquiry into something an account manager can act on.</p><div class="steps"><div class="step"><i>01</i><h3>Understand</h3><p>Capture the creative intent and type of production.</p></div><div class="step"><i>02</i><h3>Qualify</h3><p>Collect timeline, budget, deliverables and scope.</p></div><div class="step"><i>03</i><h3>Structure</h3><p>Transform the conversation into a concise project brief.</p></div><div class="step"><i>04</i><h3>Handoff</h3><p>Prepare the qualified inquiry for account-manager review.</p></div></div></section>')}
function assistant(){if(!S.msgs.length)S.msgs=[{w:'ai',t:'Hi. I’m the AI Production Assistant. Tell me what you’re looking to produce, and I’ll help turn your idea into a structured production brief.'}];var q=Q[S.step],m='';for(var i=0;i<S.msgs.length;i++)m+='<div class="msg '+S.msgs[i].w+'"><small>'+(S.msgs[i].w==='ai'?'AI Assistant':'You')+'</small>'+S.msgs[i].t+'</div>';var chips='';if(q&&OPT[q[0]])for(var j=0;j<OPT[q[0]].length;j++)chips+='<button class="chip" onclick="answer('+JSON.stringify(OPT[q[0]][j])+')">'+OPT[q[0]][j]+'</button>';var composer=S.step>=Q.length?'<button class="btn" style="width:100%" onclick="makeBrief()">Generate Project Brief →</button>':'<input id="inp" placeholder="'+q[1]+'" onkeydown="if(event.key===\'Enter\')answer(this.value)"><button class="btn" onclick="answer(document.getElementById(\'inp\').value)">Send</button>';var prog='';for(var k=0;k<Q.length;k++)prog+='<div class="p '+(k<S.step?'done':'')+'"><span></span>'+Q[k][0].replace(/([A-Z])/g,' $1')+'</div>';el('<div class="shell"><div class="top"><div><div class="ey">AI Production Assistant</div><h2>Start a Project Brief</h2><div class="sub">A conversational production-intake concept.</div></div><div class="tag">Concept Demo</div></div><div class="chat"><div><div class="messages">'+m+'</div><div class="quick">'+chips+'</div><div class="composer">'+composer+'</div></div><aside class="side"><h3>Project Brief</h3><div class="progress">'+prog+'</div><div class="note">Demo state is stored locally in this browser. No real Movie Park systems are connected.</div></aside></div></div>')}
function answer(v){v=(v||'').trim();if(!v)return;var q=Q[S.step];S.a[q[0]]=v;S.msgs.push({w:'user',t:v});S.step++;if(S.step<Q.length)S.msgs.push({w:'ai',t:Q[S.step][1]});else S.msgs.push({w:'ai',t:'Perfect. I have enough information to structure the production brief. Generate it below.'});assistant()}
function makeBrief(){S.brief={client:S.a.brand||'Dubai Luxury Automotive',project:S.a.projectType||'Commercial Film',location:S.a.location||'Dubai, UAE',deliverables:S.a.deliverables||'30-sec Hero Film + Social Cuts',deadline:S.a.deadline||'6 Weeks',budget:S.a.budget||'$50K–$75K',references:S.a.references||'Cinematic luxury visual direction',requirements:S.a.requirements||'Live action + CGI',status:'QUALIFIED'};S.inq[0]={id:1,client:S.brief.client,project:S.brief.project,location:S.brief.location,budget:S.brief.budget,status:'Qualified',date:'Just now'};go('/brief')}
function brief(){var b=S.brief||{client:'Dubai Luxury Automotive',project:'Luxury Automotive Commercial',location:'Dubai, UAE',deliverables:'30-sec Hero Film + 3 Social Cuts',deadline:'6 Weeks',budget:'$50K–$75K',references:'Cinematic luxury automotive campaign',requirements:'Live action + CGI',status:'QUALIFIED'};el('<div class="shell"><button class="back" onclick="go(\'/assistant\')">← Back to Assistant</button><div class="top"><div><div class="ey">Generated Project Brief</div><h2>'+b.project+'</h2><div class="sub">Structured from the AI conversation.</div></div><span class="status">'+b.status+'</span></div><div class="briefGrid"><div class="card"><div class="fields"><div class="field"><div class="label">Client</div><div class="value">'+b.client+'</div></div><div class="field"><div class="label">Location</div><div class="value">'+b.location+'</div></div><div class="field"><div class="label">Deliverables</div><div class="value">'+b.deliverables+'</div></div><div class="field"><div class="label">Timeline</div><div class="value">'+b.deadline+'</div></div><div class="field"><div class="label">Budget</div><div class="value">'+b.budget+'</div></div><div class="field"><div class="label">Creative Direction</div><div class="value">'+b.references+'</div></div></div><div style="margin-top:22px"><div class="label">Additional Requirements</div><p class="sub">'+b.requirements+'</p></div><div class="actions"><button class="btn" onclick="go(\'/admin\')">Send to Account Manager →</button><button class="btn alt" onclick="go(\'/assistant\')">Edit Brief</button></div></div><aside class="card"><div class="ey">AI Analysis</div><div class="analysis"><div class="row"><span>Project Type</span><b>Commercial</b></div><div class="row"><span>Complexity</span><b>High</b></div><div class="row"><span>Production Scope</span><b>Full Production</b></div><div class="row"><span>Timeline</span><b>'+b.deadline+'</b></div><div class="row"><span>Budget Range</span><b>'+b.budget+'</b></div><div class="row"><span>Status</span><b style="color:var(--good)">Qualified</b></div></div><div class="note">Qualification is simulated for this concept demo.</div></aside></div></div>')}
function portfolio(){var p=[['92% MATCH','Automotive · Commercial','Luxury Automotive','Live Action + CGI · Dubai'],['86% MATCH','Product · Commercial','Luxury Product Campaign','Studio + CGI · Global'],['81% MATCH','Fashion · Brand Film','Global Fashion Campaign','Live Action · London']];var x='';for(var i=0;i<p.length;i++)x+='<div class="project"><span class="match">'+p[i][0]+'</span><div class="pbody"><div class="ey">'+p[i][1]+'</div><h3>'+p[i][2]+'</h3><div class="sub">'+p[i][3]+'</div></div></div>';el('<div class="shell"><div class="ey">Portfolio intelligence</div><h2>Projects That Match Your Brief</h2><p class="sub">Demo matching based on production type, scope and creative requirements.</p><div class="projects">'+x+'</div></div>')}
function admin(){var rows='';for(var i=0;i<S.inq.length;i++){var x=S.inq[i];rows+='<tr class="click" onclick="go(\'/admin/inquiries/'+x.id+'\')"><td><b>'+x.client+'</b></td><td>'+x.project+'</td><td>'+x.location+'</td><td>'+x.budget+'</td><td><span class="badge '+(x.status==='Qualified'?'':'')+'">'+x.status+'</span></td><td>'+x.date+'</td></tr>'}el('<div class="shell"><div class="ey">Account manager workspace</div><h2>Production Inquiries</h2><p class="sub">AI-qualified project opportunities — concept demo.</p><div class="stats"><div class="stat"><b>12</b><span>New</span></div><div class="stat"><b>7</b><span>Qualified</span></div><div class="stat"><b>4</b><span>In Review</span></div><div class="stat"><b>9</b><span>Contacted</span></div></div><div class="tableWrap"><table class="table"><thead><tr><th>Client</th><th>Project</th><th>Location</th><th>Budget</th><th>Status</th><th>Received</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>')}
function detail(id){var x=S.inq[0];for(var i=0;i<S.inq.length;i++)if(S.inq[i].id==id)x=S.inq[i];el('<div class="shell"><button class="back" onclick="go(\'/admin\')">← Back to Inquiries</button><div class="ey">Inquiry #'+x.id+'</div><h2>'+x.client+'</h2><div class="card"><div class="detailGrid"><div><div class="label">Project</div><div class="value">'+x.project+'</div><div class="label">Location</div><div class="value">'+x.location+'</div><div class="label">Budget</div><div class="value">'+x.budget+'</div><span class="badge">'+x.status+'</span></div><div><div class="ey">AI Summary</div><p class="sub">This inquiry appears to be a high-scope commercial production requiring premium creative development and structured account-manager review.</p><div class="actions"><button class="btn" onclick="alert(\'Demo action: assigned to Account Manager\')">Assign Account Manager</button><button class="btn alt" onclick="alert(\'Demo action: marked as Contacted\')">Mark as Contacted</button></div></div></div><div class="conversation"><div class="ey">Conversation</div><div class="mini"><b>AI Assistant</b>Tell me what you’re looking to produce, and I’ll help turn your idea into a structured production brief.</div><div class="mini"><b>Client</b>We need a premium commercial campaign with a hero film and social cuts.</div><div class="mini"><b>AI Assistant</b>I’ve captured the scope and prepared the inquiry for production review.</div></div></div></div>')}
function render(){var p=location.hash.slice(1)||'/';if(p==='/')home();else if(p==='/assistant')assistant();else if(p==='/brief')brief();else if(p==='/portfolio')portfolio();else if(p==='/admin')admin();else if(p.indexOf('/admin/inquiries/')===0)detail(p.split('/').pop());else home()}window.addEventListener('hashchange',render);render();
</script><script src="phase2.js?v=4b7653e"></script></body></html>
